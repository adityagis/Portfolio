name: Notify IndexNow after deployment
on:
  workflow_dispatch:
  workflow_run:
    workflows: [pages build and deployment]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/submit_indexnow.py
